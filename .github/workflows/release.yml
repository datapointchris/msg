name: Release

on:
  push:
    branches: [main]

# Scoped per job rather than here: validate only reads, and it is the job that
# runs the most third-party code.
permissions:
  contents: read

# Two pushes to main inside one run's window would otherwise race to cut the
# same version. Never cancel-in-progress: a canceled release can leave a tag
# with no release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    uses: datapointchris/reusable-workflows/.github/workflows/go-semantic-release.yml@v1
    permissions:
      contents: write
    with:
      # Keeps this on 0.x. Without it go-semantic-release forces a major bump on
      # any change while the major is 0, so the next `fix:` would ship 1.0.0.
      allow-initial-development-versions: true

  build:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}

      # No toolchain action. rust-toolchain.toml is the pin and rustup reads it
      # on the first cargo call; dtolnay/rust-toolchain does not read that file,
      # so adding it would give two pins that disagree.
      - uses: Swatinem/rust-cache@v2

      # Cargo.toml holds 0.0.0 in git. This sets the real version in the
      # tag-checked-out working tree and is never committed back.
      - run: cargo install cargo-edit --locked
      - run: cargo set-version "$VERSION"

      - run: cargo build --release --locked --target "$TARGET"

      - name: package
        run: |
          mkdir -p dist
          tar -C "target/${TARGET}/release" -czf "dist/msg-${VERSION}-${TARGET}.tar.gz" msg
          (cd dist && sha256sum "msg-${VERSION}-${TARGET}.tar.gz" > "msg-${VERSION}-${TARGET}.tar.gz.sha256")

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          files: dist/*
